name: bandsalat
description: "Bandsalat – build mixtapes on cassettes from your own music (en + de)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.6
  intl: ^0.20.3
  url_launcher: ^6.3.3
  share_plus: ^12.0.0
  pdf: ^3.11.3
  file_picker: ^10.3.3
  path_provider: ^2.1.5
  just_audio: ^0.10.5
  just_audio_background: ^0.0.1-beta.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/sample/
  fonts:
    - family: RubikMono
      fonts:
        - asset: assets/fonts/RubikMonoOne-Regular.ttf
    - family: GochiHand
      fonts:
        - asset: assets/fonts/GochiHand-Regular.ttf
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-400.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk-500.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-700.ttf
          weight: 700
